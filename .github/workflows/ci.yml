name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same branch/PR rather than letting them queue.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fails fast and cheaply if anything matching the forensic-output patterns
  # in .githooks/pre-commit is tracked. The pre-commit hook only protects
  # commits made on a machine that installed it (core.hooksPath); this is the
  # backstop for a hook that was never installed, a --no-verify commit, or a
  # merge from a fork. See SECURITY.md and .githooks/pre-commit for the
  # original incident this guards against.
  forensic-output-guard:
    name: Forensic output guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check no forensic-output patterns are tracked
        run: |
          set -euo pipefail

          BLOCKED_PATTERNS=(
            '\.db$'
            '\.sqlite$'
            '\.sqlite3$'
            '_report\.md$'
            '^correlation_report\.md$'
            '^investigation_report\.md$'
            '^comprehensive_forensic_report\.md$'
            '(^|/)ileapp_raw_output/'
            '(^|/)[^/]*_raw_output/'
            '(^|/)mvt-workspace/'
            '(^|/)results/'
            '(^|/)decrypted/'
            '\.plist$'
            '\.ips$'
          )
          ALLOWLIST=(
            'docs/.*\.md$'
          )

          violations=()
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            allowed=0
            for allow in "${ALLOWLIST[@]}"; do
              if printf '%s' "$file" | grep -qE "$allow"; then allowed=1; break; fi
            done
            [ "$allowed" -eq 1 ] && continue
            for pattern in "${BLOCKED_PATTERNS[@]}"; do
              if printf '%s' "$file" | grep -qE "$pattern"; then
                violations+=("$file  (matched /$pattern/)")
                break
              fi
            done
          done < <(git ls-files)

          if [ "${#violations[@]}" -gt 0 ]; then
            echo "::error::Forensic-output patterns are tracked in git. See SECURITY.md."
            printf '  %s\n' "${violations[@]}"
            exit 1
          fi
          echo "No forensic-output patterns tracked."

  # Guards the "single source of truth" property the schema's own description
  # asks for (see H1 in the last review): the canonical JSON schema and the
  # Pydantic/Zod mirrors must agree on the source_type enum and field names.
  contract-sync:
    name: Contract mirror sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check contract mirrors match the canonical schema
        run: python3 scripts/sync_contracts.py --check

  python:
    name: Python (extractors, reporting, contracts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: packages-py/requirements.txt
      - name: Install dependencies
        run: pip install -r packages-py/requirements.txt
      - name: Run test suite
        run: python -m pytest packages-py

  typescript:
    name: TypeScript (workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Build library/CLI packages
        run: pnpm --filter '!@verichron/epoch' --recursive build
      - name: Typecheck
        run: pnpm --recursive typecheck
      - name: Build epoch (renderer + main process only — no electron-builder packaging in CI)
        run: pnpm --filter @verichron/epoch build:ci
