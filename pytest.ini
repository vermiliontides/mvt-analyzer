[pytest]
# Python test discovery for the repo. Import paths are set in
# packages-py/conftest.py rather than per-module sys.path shims.
testpaths = packages-py
python_files = test_*.py
addopts = -q --strict-markers
# iLEAPP is a vendored submodule with its own (unrelated, failing) tests.
norecursedirs = .git .venv node_modules dist iLEAPP __pycache__
